<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" target="_blank">
        <label>Full Name</label>
        <input type="name">
        <br>
        <label>Age</label>
        <input type="age">
        <br>
        <label>Gender</label>
        <label for="form1">male</label>
        <input type="radio" name="form1" id="male">
        <label for="form1">female</label>
        <input type="checkbox" name="form1" id="female">
        <select>
            <option>male</option>
            <option>female</option>
            <option>other</option>
        </select>
        <br>
        <label>course</label>
        <input type="course">
        <select>
            <option>BCA</option>
            <option>B.Sc</option>
            <option>B.tech</option>
        </select>
        <br>
        <label>skills</label>
        <input type="skills">
        <select>
            <option>HTML</option>
            <option>CSS</option>
            <option>JawaScript</option>
            <option>Python</option>
        </select>
        <br>
        <label>review</label>
        <textarea cols="30" rows="7" maxlength="500"></textarea>
    </form>
</body>
</html>
