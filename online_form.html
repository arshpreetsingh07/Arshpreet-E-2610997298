<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" target="_blank">
        <label for="form1">student name</label>
        <input type="name" id="form1" minlength="3" maxlength="15">
        <br>
        <label for="form2">password</label>
        <input type="password" id="form2">
        <br>
        <label for="form3">student email</label>
        <input type="email" id="form3" placeholder="enter your email">
        <br>
        <label>phone no.</label>
        <input type="phone number">
        <br>
        <label>student study mode</label>
        <label for="form4">online</label>
        <input type="radio" name="form4" id="online">
        <label for="form4">offline</label>
        <input type="radio" id="offline" name="form4">
        <br>
        <label>student's qualification</label>
        <select>
            <option>school</option>
            <option>diploma</option>
            <option>graduate</option>
        </select>
        <br>
        <label>course</label>
        <select>
            <option>BCA</option>
            <option>BBA</option>
            <option>B.Com</option>
        </select>
        <input type="hidden" name="course" value="BCA">
        <br>
        <label>feedback</label>
        <textarea rows="4" cols="35" maxlength="150"></textarea>
        <br>
        <label>student city</label>
        <input type="text" required></input>
        <br>
        <input type="text" disabled value="student">
        <br>
        <input type="submit" value="enroll now">
        <input type="button" value="check detalis">
        <button type="reset">
            reset
        </button>
    </form>
</body>
</html>
