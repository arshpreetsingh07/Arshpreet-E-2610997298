<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input</title>
</head>
<body>
    <form action="" target="_blank">
        <label for="form1">Name</label>
        <input type="Name" id="form1">
        <label for="form2">Password</label>
        <input type="password" id="form2">
        <label>Email</label>
        <input type="email">
        <label>Phone number</label>
        <input type="number">
        <label>Gender</label>
        <label for="form2">Male</label>
        <input type="radio" id="male" name="form2">
        <label for="form2">female</label>
        <input type="radio" id="female" name="form2">
        <select>
            <option>male</option>
            <option>female</option>
            <option>other</option>
        </select>    
        <label>state</label>
        <select>
            <option>punjab</option>
            <option>haryana</option>
            <option>himachal</option>
            <option>MP</option>
            <option>UP</option>   
        </select>
        <br>
        <input type="hidden" name="course" value="BCA">
        <br>
        <label>review</label>
        <textarea rows="5" cols="30" maxlength="200"></textarea>
        <input type="text" required>
        <input type="text" minlength="4" maxlength="10">
        <input type="text" disabled value="ABC">
        <input type="text" placeholder="enter your name">
        <input type="submit" value="register now">
        <input type="button" value="click now">
    </form>
</body>
</html>
